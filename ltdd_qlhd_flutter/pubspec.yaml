name: ltdd_qlhd_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.2
  shared_preferences: ^2.5.5
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  qr_flutter: ^4.1.0
  fl_chart: ^1.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/itconnect_logo_2.png"
  
flutter:
  uses-material-design: true

  assets:
    - assets/images/itconnect_logo.png
    - assets/images/itconnect_logo_2.png
    - assets/images/slide_1.png
    - assets/images/slide_2.png
    - assets/images/slide_3.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/itconnect_logo.png

  android_12:
    color: "#FFFFFF"
    image: assets/images/itconnect_logo.png